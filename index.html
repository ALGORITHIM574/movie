
<!DOCTYPE html>
<html lang="en">
<head>

        <div class="card">

            </div>
        </div>
            <div class="card">
            <img src="images/Bumblebee.jpg" alt="The Outpost">
            <div class="info">
                <h2>Bumblebee ⭐⭐⭐⭐</h2>
            </div>
        </div>
            <div class="card">
            <img src="images/Aladdin-2019.jpg" alt="The Outpost">
